name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Dọn dẹp và tạo mới cấu trúc dự án
        run: |
          # 1. Lưu tạm 3 file quan trọng của bạn
          mkdir -p /tmp/save
          cp pubspec.yaml /tmp/save/
          cp lib/main.dart /tmp/save/
          cp android/app/src/main/AndroidManifest.xml /tmp/save/
          
          # 2. Xóa các thư mục cũ có thể gây xung đột
          rm -rf lib android pubspec.yaml test
          
          # 3. Dùng Flutter tạo lại cấu trúc chuẩn 100%
          flutter create --project-name beauty_app --org com.yourname .
          
          # 4. Chép đè 3 file của bạn vào cấu trúc vừa tạo
          cp /tmp/save/pubspec.yaml ./pubspec.yaml
          cp /tmp/save/main.dart ./lib/main.dart
          cp /tmp/save/AndroidManifest.xml ./android/app/src/main/AndroidManifest.xml
          
          # 5. Build
          flutter pub get
          flutter build apk --debug

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: beauty-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
