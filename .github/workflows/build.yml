name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Tạo cấu trúc Flutter hoàn chỉnh
        run: |
          # Tạo một dự án Flutter mẫu trong thư mục tạm
          flutter create --project-name beauty_app --org com.yourname --platforms android /tmp/flutter_temp
          
          # Sao chép thư mục android chuẩn vào repo
          rm -rf android
          cp -r /tmp/flutter_temp/android ./
          
          # Sao chép các file cấu hình cần thiết khác
          cp /tmp/flutter_temp/analysis_options.yaml ./
          cp /tmp/flutter_temp/.metadata ./
          
          # Ghi đè các file tùy chỉnh của bạn
          cp pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          cp lib/main.dart ./lib/main.dart
          mkdir -p android/app/src/main
          cp android/app/src/main/AndroidManifest.xml ./android/app/src/main/AndroidManifest.xml

      - name: Cài đặt dependencies
        run: flutter pub get

      - name: Build APK (chế độ debug để tránh lỗi signing)
        run: flutter build apk --debug

      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: beauty-app-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
