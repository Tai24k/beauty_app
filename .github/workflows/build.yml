name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Tạo dự án Flutter hoàn chỉnh
        run: |
          # Tạo dự án Flutter mới trong thư mục tạm
          flutter create --project-name beauty_app --org com.yourname --platforms android /tmp/beauty_app
          
          # Sao chép toàn bộ cấu trúc dự án vào repo làm việc
          cp -r /tmp/beauty_app/android ./
          cp -r /tmp/beauty_app/lib ./
          cp -r /tmp/beauty_app/test ./
          cp -r /tmp/beauty_app/.metadata ./
          cp /tmp/beauty_app/analysis_options.yaml ./
          
          # Ghi đè hai tệp tùy chỉnh của bạn
          cp pubspec.yaml ./pubspec.yaml
          cp /tmp/beauty_app/lib/main.dart ./lib/main.dart  # (tạm thời giữ main.dart gốc)
          
          # Sao chép main.dart của bạn vào (nếu có)
          if [ -f "lib/main_custom.dart" ]; then
            cp lib/main_custom.dart ./lib/main.dart
          fi

      - name: Cài đặt dependencies
        run: flutter pub get

      - name: Build APK (chế độ debug)
        run: flutter build apk --debug

      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: beauty-app-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
